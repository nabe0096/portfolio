<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>なべのリンク帳</title>
<meta name="description" content="なべの活動リンクを一覧にして、押すだけでコピーできるページ。計測つきのリンクは貼る場所ごとに分けてコピーできます。">
<!-- 社長がリンクをコピーするための道具。検索には出さない -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6ecd9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1914" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="リンク帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{
  --bg:#f6ecd9; --card:#fffaf1; --ink:#2b2118; --muted:#7a6a58; --line:#e6d6bb;
  --chip:#efe0c4; --chip-on:#2b2118; --chip-on-ink:#fffaf1; --brand:#c8382c; --ok:#2e7d4f;
  --var-bg:#f8efdf; --shadow:0 1px 2px rgba(60,40,10,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1e1914; --card:#2a231c; --ink:#f3e9da; --muted:#b9a68e; --line:#3d3328;
    --chip:#3a2f24; --chip-on:#f3e9da; --chip-on-ink:#1e1914; --var-bg:#241e18; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1914; --card:#2a231c; --ink:#f3e9da; --muted:#b9a68e; --line:#3d3328;
  --chip:#3a2f24; --chip-on:#f3e9da; --chip-on-ink:#1e1914; --var-bg:#241e18; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.5; -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
.wrap{max-width:640px; margin:0 auto; padding:0 16px}
header{display:flex; align-items:center; gap:12px; padding:20px 0 12px}
header img{width:52px; height:52px; border-radius:50%; flex:none}
h1{font-size:21px; margin:0; letter-spacing:.02em}
.lead{margin:2px 0 0; font-size:13px; color:var(--muted); line-height:1.5}
.lead b{color:var(--ink)}
.search{display:block; width:100%; height:42px; border-radius:12px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); font-size:16px; padding:0 14px; margin:4px 0 0; -webkit-appearance:none; appearance:none}
.search::placeholder{color:var(--muted)}
.chips{position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0 8px; display:flex; gap:5px;
  overflow-x:auto; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto; height:34px; padding:0 9px; border-radius:999px; border:0; background:var(--chip); color:var(--ink);
  font:inherit; font-size:13px; font-weight:700; letter-spacing:-.01em; white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on); color:var(--chip-on-ink)}
section{margin:14px 0 22px}
h2{font-size:17px; margin:0; padding-left:10px; border-left:5px solid var(--c,#888); line-height:1.3}
.sec-sub{margin:4px 0 6px; font-size:12.5px; color:var(--muted)}
.gt{margin:14px 0 2px; font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.04em}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; margin:8px 0; box-shadow:var(--shadow); overflow:hidden}
.item{display:flex; align-items:center; gap:8px; padding:8px 8px 8px 10px; min-height:60px}
.main{flex:1; min-width:0; display:flex; align-items:center; gap:10px; background:none; border:0; padding:2px 0;
  text-align:left; color:inherit; font:inherit; cursor:pointer}
.badge{flex:none; width:40px; height:40px; border-radius:10px; display:grid; place-items:center; color:#fff;
  font-size:11px; font-weight:800; letter-spacing:-.02em; line-height:1}
.tx{min-width:0; display:flex; flex-direction:column}
.tx b{font-size:15px; line-height:1.35; font-weight:700}
.tx small{font-size:12px; color:var(--muted); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tag{display:inline-block; font-size:10.5px; font-weight:700; color:var(--brand); border:1px solid currentColor;
  border-radius:4px; padding:0 4px; margin-left:4px; vertical-align:2px; line-height:1.5}
.open{flex:none; width:36px; height:36px; border-radius:10px; display:grid; place-items:center; color:var(--muted);
  border:1px solid var(--line); text-decoration:none}
.open svg{width:16px; height:16px}
.cp{flex:none; min-width:64px; height:36px; padding:0 10px; border-radius:10px; background:var(--brand); color:#fff; border:0;
  font:inherit; font-size:14px; font-weight:700; cursor:pointer}
.cp.done{background:var(--ok)}
.pick{flex:none; height:36px; padding:0 10px; border-radius:10px; background:none; color:var(--ink); border:1.5px solid var(--ink);
  font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap}
.pick .arr{display:inline-block; transition:transform .15s}
.card.open-v .pick .arr{transform:rotate(180deg)}
.vars{display:none; background:var(--var-bg); border-top:1px solid var(--line); padding:6px 8px 8px 10px}
.card.open-v .vars{display:block}
.vnote{margin:4px 0 6px; font-size:12px; color:var(--muted)}
.vrow{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .tx b{font-size:14px}
.qrb{flex:none; height:36px; padding:0 9px; border-radius:10px; background:none; color:var(--ink); border:1px solid var(--line);
  font:inherit; font-size:12px; font-weight:700; cursor:pointer}
.empty{padding:30px 0; text-align:center; color:var(--muted)}
footer{margin:28px 0 0; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted)}
footer p{margin:0 0 8px}
#toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translate(-50%,20px); opacity:0;
  width:calc(100% - 32px); max-width:480px; background:#2b2118; color:#fffaf1; border-radius:14px; padding:10px 14px;
  font-size:14px; transition:opacity .18s, transform .18s; pointer-events:none; z-index:20}
#toast.on{opacity:1; transform:translate(-50%,0)}
#toast small{display:block; color:#d9c8ad; font-size:12px; word-break:break-all; line-height:1.4; margin-top:2px}
.sheet{position:fixed; inset:0; background:rgba(20,14,8,.55); display:flex; align-items:center; justify-content:center; z-index:30; padding:16px}
.sheet[hidden]{display:none}
.sheet .box{background:var(--card); color:var(--ink); border-radius:16px; padding:18px; width:100%; max-width:380px; text-align:center}
.sheet h3{margin:0 0 10px; font-size:16px}
.sheet .u{font-size:12px; color:var(--muted); word-break:break-all; margin:8px 0}
.sheet input{width:100%; height:42px; font-size:16px; border-radius:10px; border:1px solid var(--line); padding:0 10px; background:var(--bg); color:var(--ink)}
#qrimg{display:flex; justify-content:center; background:#fff; padding:12px; border-radius:12px}
#qrimg img,#qrimg canvas{width:240px; height:240px}
.close{margin-top:12px; width:100%; height:44px; border-radius:12px; border:0; background:var(--chip-on); color:var(--chip-on-ink); font:inherit; font-weight:700}
</style>

      return '<div class="card" data-key="' + esc(key) + '"><div class="item">' +
        '<button type="button" class="main" data-copy="' + esc(it.url) + '">' + badge(it) +
        '<span class="tx"><b>' + esc(it.name) + "</b><small>" + esc(it.sub ? it.sub + "・" + short(it.url) : short(it.url)) + "</small></span></button>" +
        '<a class="open" href="' + esc(it.url) + '" target="_blank" rel="noopener" aria-label="' + esc(it.name) + 'を開く">' + OPEN + "</a>" +
        '<button type="button" class="cp" data-copy="' + esc(it.url) + '">コピー</button></div></div>';
    }
    var places = D.places[it.track] || [];
    var rows = places.map(function(p){
      var u = withSrc(it.url, p[0]);
      return '<div class="vrow"><span class="tx" style="flex:1"><b>' + esc(p[1]) + "</b><small>" + esc(short(u)) + "</small></span>" +
        (p[0] === "qr" ? '<button type="button" class="qrb" data-qr="' + esc(u) + '">QR</button>' : "") +
        '<button type="button" class="cp" data-copy="' + esc(u) + '">コピー</button></div>';
    }).join("");
    return '<div class="card" data-key="' + esc(key) + '"><div class="item">' +
      '<button type="button" class="main" data-toggle="1" aria-expanded="false">' + badge(it) +
      '<span class="tx"><b>' + esc(it.name) + '<span class="tag">計測つき</span></b><small>' + esc(it.sub || short(it.url)) + "</small></span></button>" +
      '<a class="open" href="' + esc(it.url) + '" target="_blank" rel="noopener" aria-label="' + esc(it.name) + 'を開く">' + OPEN + "</a>" +
      '<button type="button" class="pick" data-toggle="1">貼る場所 <span class="arr">▾</span></button></div>' +
      '<div class="vars"><p class="vnote">貼る場所を選んでコピー。登録・購入の通知に、その場所の名前が出ます。</p>' + rows + "</div></div>";
  }
  function render(){
    $("chips").innerHTML = [["all", "すべて"]].concat(D.sections.map(function(s){ return [s.id, s.chip]; })).map(function(c){
      return '<button type="button" class="chip" data-cat="' + c[0] + '" aria-pressed="false">' + esc(c[1]) + "</button>";
    }).join("");
    $("list").innerHTML = D.sections.map(function(s){
      return '<section data-cat="' + esc(s.id) + '" style="--c:' + esc(s.color) + '"><h2>' + esc(s.title) + "</h2>" +
        (s.sub ? '<p class="sec-sub">' + esc(s.sub) + "</p>" : "") +
        s.groups.map(function(g){
          return '<div class="grp">' + (g.title ? '<p class="gt">' + esc(g.title) + "</p>" : "") + g.items.map(itemHtml).join("") + "</div>";
        }).join("") + "</section>";
    }).join("") + '<p class="empty" id="empty" hidden>見つかりませんでした</p>';
    $("upd").textContent = "最終更新 " + D.updated;
  }
  function apply(){
    var q = $("q").value.trim().toLowerCase(), anyAll = false;
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(b){ b.setAttribute("aria-pressed", String(b.dataset.cat === cat)); });
    Array.prototype.forEach.call(document.querySelectorAll("#list section"), function(sec){
      var catOk = !!q || cat === "all" || sec.dataset.cat === cat, any = false;
      Array.prototype.forEach.call(sec.querySelectorAll(".grp"), function(g){
        var gAny = false;
        Array.prototype.forEach.call(g.querySelectorAll(".card"), function(c){
          var hit = !q || c.dataset.key.indexOf(q) >= 0; c.hidden = !hit; if (hit) gAny = true;
        });
        g.hidden = !gAny; if (gAny) any = true;
      });
      sec.hidden = !(catOk && any); if (!sec.hidden) anyAll = true;
    });
    $("empty").hidden = anyAll;
  }

  var toastTimer;
  function toast(msg, sub){
    var t = $("toast");
    t.innerHTML = esc(msg) + (sub ? "<small>" + esc(sub) + "</small>" : "");
    t.classList.add("on"); clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 2200);
  }
  function legacyCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta); return ok;
  }
  function copied(text, el){
    var btn = el.classList.contains("cp") ? el : (el.closest(".item, .vrow") || el).querySelector(".cp");
    if (btn) {
      btn.classList.add("done"); btn.textContent = "コピー済";
      clearTimeout(btn._t); btn._t = setTimeout(function(){ btn.classList.remove("done"); btn.textContent = "コピー"; }, 1600);
    }
    toast("コピーしました", text);
  }
  function manual(text){
    $("sheetbox").innerHTML = "<h3>長押ししてコピーしてください</h3><input id=\"mi\" readonly value=\"" + esc(text) + "\">" +
      '<button type="button" class="close" data-close="1">閉じる</button>';
    $("sheet").hidden = false;
    var mi = $("mi"); mi.focus(); mi.select(); mi.setSelectionRange(0, text.length);
  }
  function doCopy(text, el){
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function(){ copied(text, el); }, function(){
        if (legacyCopy(text)) copied(text, el); else manual(text);
      });
    } else if (legacyCopy(text)) copied(text, el); else manual(text);
  }
  function showQr(u){
    $("sheetbox").innerHTML = '<h3>QRコード</h3><div id="qrimg"></div><p class="u">' + esc(u) + "</p>" +
      '<p class="u">長押しで画像を保存できます</p><button type="button" class="close" data-close="1">閉じる</button>';
    $("sheet").hidden = false;
    var draw = function(){ new window.QRCode($("qrimg"), { text: u, width: 480, height: 480, correctLevel: window.QRCode.CorrectLevel.M }); };
    if (window.QRCode) { draw(); return; }
    var sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    sc.onload = draw;
    sc.onerror = function(){ $("qrimg").textContent = "QRコードを作れませんでした。電波のいいところで、もう一度押してください。"; };
    document.head.appendChild(sc);
  }

  document.addEventListener("click", function(e){
    var t = e.target;
    var c = t.closest("[data-copy]"); if (c) { doCopy(c.dataset.copy, c); return; }
    var tg = t.closest("[data-toggle]");
    if (tg) {
      var card = tg.closest(".card"), on = !card.classList.contains("open-v");
      card.classList.toggle("open-v", on);
      card.querySelector(".main").setAttribute("aria-expanded", String(on));
      return;
    }
    var qr = t.closest("[data-qr]"); if (qr) { showQr(qr.dataset.qr); return; }
    var ch = t.closest(".chip");
    if (ch) {
      cat = ch.dataset.cat; try { localStorage.setItem(CAT_KEY, cat); } catch (er) {}
      apply(); window.scrollTo({ top: 0, behavior: "smooth" }); return;
    }
    if (t.closest("[data-close]") || t === $("sheet")) { $("sheet").hidden = true; }
  });
  $("q").addEventListener("input", apply);

  render();
  if (!document.querySelector('.chip[data-cat="' + cat + '"]')) cat = "all";
  apply();
})();
</script>
</body>
</html>
